name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace-tests:
    name: Core + DB (Windows GNU)
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The runner context is not available in a job-level `env` block, so the
      # target directory is exported to later steps through GITHUB_ENV instead.
      - name: Configure CARGO_TARGET_DIR
        run: |
          "CARGO_TARGET_DIR=$env:RUNNER_TEMP\acc-target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Rust GNU toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          targets: x86_64-pc-windows-gnu
          components: rustfmt, clippy

      - name: Install MinGW-w64 (GCC, UCRT)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Add MinGW-w64 UCRT to PATH
        run: |
          "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify toolchain
        run: |
          rustc -vV
          cargo -V
          gcc --version

      - name: Check formatting
        run: |
          cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: |
          cargo clippy --workspace --all-targets --exclude daftar-app -- -D warnings

      - name: Run workspace tests
        run: |
          cargo test --workspace --all-targets --exclude daftar-app

  tauri-gnu-probe:
    name: Tauri 2 probe (Windows GNU)
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The runner context is not available in a job-level `env` block, so the
      # target directory is exported to later steps through GITHUB_ENV instead.
      - name: Configure CARGO_TARGET_DIR
        run: |
          "CARGO_TARGET_DIR=$env:RUNNER_TEMP\acc-target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Rust GNU toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          targets: x86_64-pc-windows-gnu
          components: rustfmt, clippy

      - name: Install MinGW-w64 (GCC, UCRT)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Add MinGW-w64 UCRT to PATH
        run: |
          "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify toolchain
        run: |
          rustc -vV
          cargo -V
          gcc --version
          where.exe rustc
          where.exe gcc

      - name: Check formatting (probe)
        run: |
          cargo fmt --manifest-path probe/tauri-probe/src-tauri/Cargo.toml -- --check

      - name: Build Tauri probe (GNU)
        run: |
          cargo build --manifest-path probe/tauri-probe/src-tauri/Cargo.toml --target x86_64-pc-windows-gnu

      - name: Clippy (probe, deny warnings)
        run: |
          cargo clippy --manifest-path probe/tauri-probe/src-tauri/Cargo.toml --target x86_64-pc-windows-gnu -- -D warnings

      - name: Check formatting (app)
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Build Tauri app (GNU)
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-gnu

      - name: Clippy (app, deny warnings)
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-gnu -- -D warnings

      - name: Stage WebView2 loader (if present)
        run: |
          $exeDir = Join-Path $env:CARGO_TARGET_DIR "x86_64-pc-windows-gnu\debug"
          $dll = Get-ChildItem $env:CARGO_TARGET_DIR -Recurse -Filter WebView2Loader.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dll) {
            Copy-Item $dll.FullName $exeDir -Force
            Write-Output "Copied $($dll.FullName)"
          } else {
            Write-Output "No WebView2Loader.dll found; the system WebView2 runtime may be used."
          }

      - name: Inspect DLL dependencies (non-fatal)
        continue-on-error: true
        run: |
          $exe = Join-Path $env:CARGO_TARGET_DIR "x86_64-pc-windows-gnu\debug\daftar-probe.exe"
          & "C:\msys64\ucrt64\bin\objdump.exe" -p $exe | Select-String "DLL Name"
          $appExe = Join-Path $env:CARGO_TARGET_DIR "x86_64-pc-windows-gnu\debug\daftar-app.exe"
          & "C:\msys64\ucrt64\bin\objdump.exe" -p $appExe | Select-String "DLL Name"

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: daftar-tauri-gnu
          path: |
            ${{ runner.temp }}\acc-target\x86_64-pc-windows-gnu\debug\daftar-probe.exe
            ${{ runner.temp }}\acc-target\x86_64-pc-windows-gnu\debug\daftar-app.exe
            ${{ runner.temp }}\acc-target\x86_64-pc-windows-gnu\debug\WebView2Loader.dll
          if-no-files-found: error
