[package]
name = "daftar-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
build = "build.rs"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "s"
panic = "abort"
