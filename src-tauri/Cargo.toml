[package]
name = "daftar-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
daftar-core = { workspace = true }
daftar-db = { workspace = true }
daftar-services = { workspace = true }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[lints]
workspace = true

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "s"
panic = "abort"
